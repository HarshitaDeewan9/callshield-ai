server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: callshield-gateway
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/callshield;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  threads:
    virtual:
      enabled: true
callshield:
  ai-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  ai-key: ${APP_API_KEY:}
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5173}
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    org.hibernate.SQL: WARN
