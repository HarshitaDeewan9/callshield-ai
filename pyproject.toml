[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "callshield-ai"
version = "0.1.0"
description = "Consent-first Gnani speech and Evon risk orchestration"
requires-python = ">=3.11"
dependencies = ["fastapi==0.152.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.1", "pydantic-settings==2.16.1", "python-multipart==0.0.32", "anyio==4.15.1", "websockets==17.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1", "gnani-vachana==0.8.1"]
gnani = ["gnani-vachana==0.8.1"]
google = ["google-cloud-translate==3.28.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI's documented dependency/parameter declaration pattern.
ignore = ["B008"]

